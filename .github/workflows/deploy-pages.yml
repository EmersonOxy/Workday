name: Publicar Workday no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  # Nada é publicado se a verificação falhar: sintaxe, paleta, build (com checagem de arquivos da versão web) e suítes.
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sintaxe, paleta e build
        run: |
          cat src/js/shared/*.js src/js/*.js > /tmp/workday.js
          node --check /tmp/workday.js
          python tools/palette.py
          python tools/build.py

      - name: Instalar Playwright e Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Executar suítes
        run: |
          for t in relogio saves mensageiro mesa parede caneca gatos-estaticos gatos-save-teste npc-portraits workos-wallpapers arcade-new regression; do
            echo "::group::$t"
            node tests/$t.js
            echo "::endgroup::"
          done

  publicar:
    needs: verificar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compilar Workday para web
        run: python tools/build.py

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

      - name: Publicar no GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
