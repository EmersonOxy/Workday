name: Baixar Workday - prévia dos gatos
on:
  push:
    branches:
      - fix/gatos-pretos-miniaturas-20261104
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compilar-previa:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código da branch de testes
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compilar jogo offline
        run: python tools/build.py
      - name: Publicar arquivo para teste (download)
        uses: actions/upload-artifact@v4
        with:
          name: Workday-Teste-Gatos-HTML
          path: dist/workday.html
          retention-days: 14
